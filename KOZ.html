<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="description" content="KOZ CARS" />
    <meta name="keywords" content="cars,automotive,engines,koz" />
    <meta name="robots" content="index,follow" />
    <link rel="icon" type="image/png" href="assets/icon%209%20.1.png" />
    <link rel="stylesheet" href="css/KOZ-CSS.css" />

    <title>KOZ CARS</title>
  </head>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔥 بياناتك (هاي صح من عندك)
const firebaseConfig = {
  apiKey: "AIzaSyA6uGKmERwXd8MnPTrjmRYWo1oJKArl5Xo",
  authDomain: "koz-cars.firebaseapp.com",
  projectId: "koz-cars",
  storageBucket: "koz-cars.firebasestorage.app",
  messagingSenderId: "266418178521",
  appId: "1:266418178521:web:e67a9b81f1a758d65731c8",
  measurementId: "G-WNHQ9SR3PG"
};

// تشغيل Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔥 جلب السيارات وعرضها
async function loadCars() {
  const container = document.getElementById("cars-container");

  const querySnapshot = await getDocs(collection(db, "cars"));

// داخل الـ forEach
querySnapshot.forEach((doc) => {
  const car = doc.data();

  container.innerHTML += `
    <div class="car-card">
      <img src="${car.image}" class="car-image" alt="${car.name}">
      <h2 class="car-title">${car.name}</h2>
      <p class="car-price">${car.price} $</p>
    </div>
  `;
});
}

loadCars();
</script>
  <body>
  <header>
  <div class="left">
    <h1>By KOZ Cooperation</h1>
  </div>

  <div class="center">
    <img src="assets/icon%209%20.1.png" alt="CENTER LOGO" class="logo" />
  </div>

  <div class="right">
    <button class="menu-btn" id="menuBtn">Menu ☰</button>
  </div>

  <nav id="navlinks" class="nav-links">
    <a href="https://kozcooperation.netlify.app/index.html">To KOZ Cooperation</a>
    <a href="#">Who are we</a>
    <a href="#">Contact us</a>
    <a href="#">Services</a>
  </nav>
</header>

    <div id="overlay"></div>
<div id="cars-container"></div>
<footer class="footer">
  <p>Powered by<a href="https://kozcooperation.netlify.app/index.html"> © KOZ Tech</a></p>

  <div class="footer-links"></div>
</footer>


    <script src="js/KOZ.js"></script>
  </body>
</html>
